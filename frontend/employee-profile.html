<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile - Mayur Tech</title>


    <style>

        .task-status {
    min-width: 140px;
    padding: 9px 12px;

    border: 1px solid #303a55;
    border-radius: 10px;

    background: #11182b;
    color: #ffffff;

    font-size: 13px;
    font-weight: 600;

    outline: none;
    cursor: pointer;
}

.task-status:hover {
    border-color: #00e5ff;
}

.task-status:focus {
    border-color: #00e5ff;
    box-shadow: 0 0 0 2px rgba(0,229,255,.12);
}

.task-status option {
    background: #11182b;
    color: #ffffff;
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(0, 229, 255, 0.08),

                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(124, 77, 255, 0.08),
                    transparent 30%
                ),

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            height: 72px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;

            background:
                rgba(10, 15, 28, 0.95);

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

            position: sticky;

            top: 0;

            z-index: 100;

            backdrop-filter: blur(15px);

        }


        .logo {

            font-size: 22px;

            font-weight: 800;

            letter-spacing: .5px;

        }


        .logo span {

            color: #00e5ff;

        }


        .header-right {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .header-name {

            color: #d9e1f2;

            font-size: 14px;

        }


        .header-avatar {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: 800;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #7c4dff
                );

        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {

            width: 100%;

            max-width: 1200px;

            margin: auto;

            padding:
                35px 25px 60px;

        }


        .page-title {

            margin-bottom: 25px;

        }


        .page-title h1 {

            font-size: 30px;

            margin-bottom: 7px;

        }


        .page-title p {

            color: #8b96aa;

            font-size: 14px;

        }


        /* =====================================================
           PROFILE
        ===================================================== */

        .profile-card {

            background:
                linear-gradient(
                    145deg,
                    rgba(19,27,47,.98),
                    rgba(11,16,29,.98)
                );

            border:
                1px solid
                rgba(255,255,255,.07);

            border-radius: 22px;

            padding: 28px;

            margin-bottom: 25px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.25);

        }


        .profile-top {

            display: flex;

            align-items: center;

            gap: 20px;

            margin-bottom: 28px;

        }


        .profile-avatar {

            width: 90px;

            height: 90px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 34px;

            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #7c4dff
                );

            box-shadow:
                0 0 35px

        }


        .profile-name {

            font-size: 27px;

            font-weight: 800;

            margin-bottom: 7px;

        }


        .profile-designation {

            color: #00e5ff;

            font-size: 14px;

            margin-bottom: 6px;

        }


        .profile-code {

            color: #7f8aa0;

            font-size: 13px;

        }


        /* =====================================================
           INFO GRID
        ===================================================== */

        .info-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 14px;

        }


        .info-box {

            padding: 16px;

            border-radius: 14px;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.055);

        }


        .info-label {

            color: #77839a;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: .7px;

            margin-bottom: 7px;

        }


        .info-value {

            color: #e9eef9;

            font-size: 14px;

            word-break: break-word;

        }


        /* =====================================================
           STATS
        ===================================================== */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 16px;

            margin-bottom: 30px;

        }


        .stat-card {

            padding: 22px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #111a2e,
                    #0c1425
                );

            border:
                1px solid
                rgba(255,255,255,.07);

        }


        .stat-number {

            color: #00e5ff;

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 5px;

        }


        .stat-label {

            color: #8792a8;

            font-size: 13px;

        }


        /* =====================================================
           SECTION HEADER
        ===================================================== */

        .section {

            margin-top: 30px;

        }


        .section-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 16px;

        }


        .section-title {

            font-size: 21px;

            font-weight: 800;

        }


        .section-count {

            color: #00e5ff;

            background:
                rgba(0,229,255,.08);

            padding:
                6px 12px;

            border-radius: 20px;

            font-size: 12px;

        }


        /* =====================================================
           PROJECT GRID
        ===================================================== */

        .projects-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;

        }


        .project-card {

            padding: 22px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18,27,47,.98),
                    rgba(10,15,28,.98)
                );

            border:
                1px solid
                rgba(255,255,255,.07);

            transition:
                .25s ease;

        }


        .project-card:hover {

            transform:
                translateY(-3px);

            border-color:
                rgba(0,229,255,.35);

            box-shadow:
                0 15px 35px
                rgba(0,0,0,.25);

        }


        .project-title {

            font-size: 18px;

            font-weight: 750;

            margin-bottom: 9px;

        }


        .project-description {

            color: #8994a9;

            font-size: 13px;

            line-height: 1.6;

            min-height: 42px;

        }


        .project-info {

            display: grid;

            grid-template-columns:
                repeat(2,1fr);

            gap: 10px;

            margin-top: 18px;

        }


        .project-meta {

            padding: 11px;

            border-radius: 10px;

            background:
                rgba(255,255,255,.035);

        }


        .meta-label {

            color: #707b91;

            font-size: 9px;

            text-transform: uppercase;

            margin-bottom: 5px;

        }


        .meta-value {

            color: #dce4f4;

            font-size: 12px;

        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {

            display: inline-block;

            margin-top: 15px;

            padding:
                6px 11px;

            border-radius: 20px;

            font-size: 10px;

        }


        .status-active {

            color: #39e6a2;

            background:
                rgba(0,230,150,.10);

        }


        .status-pending {

            color: #ffc107;

            background:
                rgba(255,193,7,.10);

        }


        .status-completed {

            color: #70b8ff;

            background:
                rgba(100,180,255,.10);

        }


        .status-default {

            color: #c5cede;

            background:
                rgba(255,255,255,.07);

        }


        /* =====================================================
           TASKS
        ===================================================== */

        .tasks-list {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .task-card {

            padding: 17px;

            border-radius: 15px;

            background:
                #10182b;

            border:
                1px solid
                rgba(255,255,255,.06);

        }


        .task-top {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 15px;

        }


        .task-title {

            font-size: 15px;

            font-weight: 700;

        }


        .task-project {

            color: #00e5ff;

            font-size: 12px;

            margin-top: 5px;

        }


        .task-description {

            color: #818ca1;

            font-size: 12px;

            line-height: 1.5;

            margin-top: 10px;

        }


        .task-bottom {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 12px;

        }


        .priority {

            color: #b49cff;

            background:
                rgba(124,77,255,.12);

            padding:
                5px 9px;

            border-radius: 15px;

            font-size: 10px;

        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty {

            padding: 35px;

            text-align: center;

            border-radius: 16px;

            border:
                1px dashed
                rgba(255,255,255,.10);

            background:
                rgba(255,255,255,.025);

            color: #737f95;

            font-size: 14px;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            padding: 50px;

            text-align: center;

            color: #7e899e;

        }


        .error {

            padding: 20px;

            border-radius: 14px;

            color: #ff9292;

                rgba(255,60,60,.08);

        /* =====================================================
           RESPONSIVE

        @media(max-width:600px){

            }

            }

                font-size: 22px;

            }

                grid-template-columns:

            }


            .stats {

                grid-template-columns:
                    1fr;

            }


            .project-info {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>

<script>

    async function updateTaskStatus(select){

    const taskId =
        select.dataset.taskId;

    const status =
        select.value;


    if(!taskId){

        alert("Task ID not found");

        return;

    }


    try{

        const response =
            await fetch(
                `/api/tasks/${taskId}/status`,
                {
                    method: "PUT",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            status: status
                        })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to update status"
            );

        }


        alert(
            "✅ Task status updated"
        );


        loadProfile();

    }
    catch(error){

        console.error(error);

        alert(
            "❌ " +
            error.message
        );

    }

}


/* =====================================================
   GET LOGIN USER
===================================================== */

const savedUser =
    localStorage.getItem(
        "scmsUser"
    );


if(!savedUser){

    window.location.href =
        "/login";

}


let currentUser = null;


try{

    currentUser =
        JSON.parse(savedUser);

}catch(error){

    localStorage.removeItem(
        "scmsUser"
    );

    window.location.href =
        "/login";

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status){

    if(!status){

        return "status-default";

    }


    const value =
        String(status)
        .toLowerCase();


    if(value === "active"){

        return "status-active";

    }


    if(value === "pending"){

        return "status-pending";

    }


    if(
        value === "completed" ||
        value === "complete"
    ){

        return "status-completed";

    }


    return "status-default";

}



/* =====================================================
   LOAD EMPLOYEE PROFILE
===================================================== */

async function loadProfile(){

    const profileArea =
        document.getElementById(
            "profileArea"
        );


    try{

        const userId =
            currentUser.id;


        if(!userId){

            throw new Error(
                "Login user ID not found."
            );

        }


        /* =============================================
           PROFILE API
        ============================================= */

        const profileResponse =
            await fetch(
                `/api/employees/user/${userId}`,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        const profileData =
            await profileResponse.json();


        if(
            !profileResponse.ok ||
            !profileData.success
        ){

            throw new Error(
                profileData.message ||
                "Unable to load profile."
            );

        }


        const employee =
            profileData.employee || {};



        /* =============================================
           PROJECT API
        ============================================= */

        const projectResponse =
            await fetch(
                `/api/employee/projects/${userId}`,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        const projectData =
            await projectResponse.json();


        if(
            !projectResponse.ok ||
            !projectData.success
        ){

            throw new Error(
                projectData.message ||
                "Unable to load projects."
            );

        }


        const projects =
            projectData.projects || [];



        /* =============================================
           TASK API
        ============================================= */

        let tasks = [];


        try{

            const taskResponse =
                await fetch(
                    `/api/tasks`,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            const taskData =
                await taskResponse.json();


            if(taskData.success){

                tasks =
                    (taskData.tasks || [])
                    .filter(
                        task =>

                            Number(
                                task.employee_id
                            ) ===
                            Number(
                                employee.id
                            )
                    );

            }

        }catch(taskError){

            console.error(
                "TASK ERROR:",
                taskError
            );

        }



        /* =============================================
           HEADER
        ============================================= */

        const employeeName =
            employee.name ||
            currentUser.name ||
            "Employee";


        document.getElementById(
            "headerName"
        ).textContent =
            employeeName;


        document.getElementById(
            "headerAvatar"
        ).textContent =
            employeeName
                .charAt(0)
                .toUpperCase();



        /* =============================================
           PROFILE CARD
        ============================================= */

        profileArea.className =
            "profile-card";


        profileArea.innerHTML = `

            <div class="profile-top">


                <div class="profile-avatar">

                    ${escapeHtml(
                        employeeName
                            .charAt(0)
                            .toUpperCase()
                    )}

                </div>


                <div>

                    <div class="profile-name">

                        ${escapeHtml(
                            employeeName
                        )}

                    </div>


                    <div class="profile-designation">

                        ${escapeHtml(
                            employee.designation ||
                            "Employee"
                        )}

                    </div>


                    <div class="profile-code">

                        Employee Code:
                        ${escapeHtml(
                            employee.employee_code ||
                            "-"
                        )}

                    </div>

                </div>


            </div>



            <div class="info-grid">


                <div class="info-box">

                    <div class="info-label">
                        Email
                    </div>

                    <div class="info-value">

                        ${escapeHtml(
                            employee.email ||
                            currentUser.email ||
                            "-"
                        )}

                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Department
                    </div>

                    <div class="info-value">

                        ${escapeHtml(
                            employee.department ||
                            "-"
                        )}

                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Designation
                    </div>

                    <div class="info-value">

                        ${escapeHtml(
                            employee.designation ||
                            "-"
                        )}

                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Phone
                    </div>

                    <div class="info-value">

                        ${escapeHtml(
                            employee.phone ||
                            "-"
                        )}

                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Joining Date
                    </div>

                    <div class="info-value">

                        ${escapeHtml(
                            employee.joining_date ||
                            "-"
                        )}

                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Status
                    </div>

                    <div class="info-value">

                        ${escapeHtml(
                            employee.status ||
                            "Active"
                        )}

                    </div>

                </div>


            </div>

        `;



        /* =============================================
           STATS
        ============================================= */

        const activeProjects =
            projects.filter(
                project =>
                    String(
                        project.status || ""
                    ).toLowerCase()
                    === "active"
            );


        document.getElementById(
            "statsArea"
        ).style.display =
            "grid";


        document.getElementById(
            "projectCount"
        ).textContent =
            projects.length;


        document.getElementById(
            "taskCount"
        ).textContent =
            tasks.length;


        document.getElementById(
            "activeProjectCount"
        ).textContent =
            activeProjects.length;


        document.getElementById(
            "projectBadge"
        ).textContent =
            `${projects.length} ${
                projects.length === 1
                ? "Project"
                : "Projects"
            }`;


        document.getElementById(
            "taskBadge"
        ).textContent =
            `${tasks.length} ${
                tasks.length === 1
                ? "Task"
                : "Tasks"
            }`;



        /* =============================================
           PROJECTS
        ============================================= */

        const projectsList =
            document.getElementById(
                "projectsList"
            );


        if(projects.length === 0){

            projectsList.innerHTML = `

                <div class="empty">

                    📁 No project has been assigned to you yet.

                </div>

            `;

        }else{

            projectsList.innerHTML =

                projects
                .map(
                    project => {


                        const status =
                            project.status ||
                            "Pending";


                        return `

                            <div class="project-card">


                                <div class="project-title">

                                    📁
                                    ${escapeHtml(
                                        project.project_name
                                    )}

                                </div>


                                <div class="project-description">

                                    ${escapeHtml(
                                        project.description ||
                                        "No description available."
                                    )}

                                </div>


                                <div class="project-info">


                                    <div class="project-meta">

                                        <div class="meta-label">
                                            Client
                                        </div>

                                        <div class="meta-value">

                                            ${escapeHtml(
                                                project.client_name ||
                                                "-"
                                            )}

                                        </div>

                                    </div>


                                    <div class="project-meta">

                                        <div class="meta-label">
                                            Start Date
                                        </div>

                                        <div class="meta-value">

                                            ${escapeHtml(
                                                project.start_date ||
                                                "-"
                                            )}

                                        </div>

                                    </div>


                                    <div class="project-meta">

                                        <div class="meta-label">
                                            Deadline
                                        </div>

                                        <div class="meta-value">

                                            ${escapeHtml(
                                                project.deadline ||
                                                "-"
                                            )}

                                        </div>

                                    </div>


                                    <div class="project-meta">

                                        <div class="meta-label">
                                            Project ID
                                        </div>

                                        <div class="meta-value">

                                            #${escapeHtml(
                                                project.id
                                            )}

                                        </div>

                                    </div>


                                </div>


                                <span
                                    class="
                                        status
                                        ${getStatusClass(
                                            status
                                        )}
                                    "
                                >

                                    ${escapeHtml(
                                        status
                                    )}

                                </span>


                            </div>

                        `;

                    }
                )
                .join("");

        }



        /* =============================================
           TASKS
        ============================================= */

        const tasksList =
            document.getElementById(
                "tasksList"
            );


        if(tasks.length === 0){

            tasksList.innerHTML = `

                <div class="empty">

                    ✅ No task has been assigned to you yet.

                </div>

            `;

        }else{

            tasksList.innerHTML =

                tasks
                .map(
                    task => {


                        const status =
                            task.status ||
                            "Pending";


                        return `

                            <div class="task-card">


                                <div class="task-top">


                                    <div>


                                        <div class="task-title">

                                            ${escapeHtml(
                                                task.title ||
                                                "Untitled Task"
                                            )}

                                        </div>


                                        <div class="task-project">

                                            📁
                                            ${escapeHtml(
                                                task.project_name ||
                                                "No Project"
                                            )}

                                        </div>


                                    </div>


                                    <select
    class="task-status"
    onchange="updateTaskStatus(this)"
    data-task-id="${task.id}"
>
    <option value="Pending"
        ${task.status === "Pending" ? "selected" : ""}>
        Pending
    </option>

    <option value="In Progress"
        ${task.status === "In Progress" ? "selected" : ""}>
        In Progress
    </option>

    <option value="Completed"
        ${task.status === "Completed" ? "selected" : ""}>
        Completed
    </option>
</select>


                                </div>


                                <div class="task-description">

                                    ${escapeHtml(
                                        task.description ||
                                        "No description available."
                                    )}

                                </div>


                                <div class="task-bottom">


                                    <span class="priority">

                                        Priority:
                                        ${escapeHtml(
                                            task.priority ||
                                            "Medium"
                                        )}

                                    </span>


                                    <span class="priority">

                                        Deadline:
                                        ${escapeHtml(
                                            task.deadline ||
                                            "-"
                                        )}

                                    </span>


                                </div>


                            </div>

                        `;

                    }
                )
                .join("");

        }


    }catch(error){

        console.error(
            "PROFILE LOAD ERROR:",
            error
        );


        profileArea.className =
            "error";


        profileArea.innerHTML = `

            ❌
            ${escapeHtml(
                error.message
            )}

        `;


        document.getElementById(
            "projectsList"
        ).innerHTML = `

            <div class="empty">

                Unable to load projects.

            </div>

        `;


        document.getElementById(
            "tasksList"
        ).innerHTML = `

            <div class="empty">

                Unable to load tasks.

            </div>

        `;

    }

}



/* =====================================================
   START
===================================================== */

loadProfile();

</script>


</body>

</html>
