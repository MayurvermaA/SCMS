<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Forgot Password - SCMS</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#080b16;

    color:white;

    padding:20px;
}

.card{
    width:430px;

    max-width:100%;

    padding:40px;

    background:#111628;

    border:1px solid #303750;

    border-radius:20px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.35);
}

.logo{
    width:70px;

    height:70px;

    margin:0 auto 25px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            #6c63ff,
            #00cfff
        );

    font-size:25px;

    font-weight:bold;
}

h1{
    text-align:center;

    margin-bottom:10px;

    font-size:28px;
}

.subtitle{
    text-align:center;

    color:#858fa8;

    margin-bottom:30px;

    line-height:1.5;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;

    margin-bottom:8px;

    color:#c8cede;

    font-size:14px;

    font-weight:600;
}

.input-wrapper{
    position:relative;
}

input{
    width:100%;

    padding:14px;

    background:#0b0f1d;

    color:white;

    border:1px solid #303750;

    border-radius:10px;

    outline:none;

    font-size:15px;

    transition:0.2s;
}

input:focus{
    border-color:#6c63ff;

    box-shadow:
        0 0 0 3px rgba(108,99,255,0.12);
}

.password-input{
    padding-right:65px;
}

.toggle{
    position:absolute;

    right:10px;

    top:50%;

    transform:translateY(-50%);

    width:auto;

    padding:5px 8px;

    background:transparent;

    color:#8d98b3;

    border:none;

    font-size:13px;

    cursor:pointer;
}

.toggle:hover{
    color:#00cfff;
}

button[type="submit"]{

    width:100%;

    padding:14px;

    margin-top:5px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #6c63ff,
            #00cfff
        );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.2s;
}

button[type="submit"]:hover{
    opacity:0.9;

    transform:translateY(-1px);
}

button[type="submit"]:disabled{
    opacity:0.6;

    cursor:not-allowed;

    transform:none;
}

.message{

    display:none;

    padding:12px;

    margin-bottom:18px;

    border-radius:9px;

    text-align:center;

    font-size:14px;

    line-height:1.4;
}

.message.show{
    display:block;
}

.message.success{
    background:#123d2b;

    border:1px solid #1f7a51;

    color:#65e6a1;
}

.message.error{
    background:#421c25;

    border:1px solid #8b3042;

    color:#ff899b;
}

.back{
    display:block;

    text-align:center;

    margin-top:22px;

    color:#8d98b3;

    text-decoration:none;

    font-size:14px;
}

.back:hover{
    color:#00cfff;
}

.password-hint{

    margin-top:7px;

    color:#68728b;

    font-size:12px;
}

@media(max-width:480px){

    .card{
        padding:30px 22px;
    }

    h1{
        font-size:24px;
    }

}

</style>

</head>


<body>


<div class="card">


    <div class="logo">
        SC
    </div>


    <h1>
        Forgot Password?
    </h1>


    <p class="subtitle">
        Enter your registered email and create a new password.
    </p>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <form
        id="forgotPasswordForm"
        onsubmit="resetPassword(event)"
    >


        <!-- EMAIL -->

        <div class="form-group">

            <label for="resetEmail">
                Email Address
            </label>

            <input
                type="email"
                id="resetEmail"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

        </div>


        <!-- NEW PASSWORD -->

        <div class="form-group">

            <label for="newPassword">
                New Password
            </label>

            <div class="input-wrapper">

                <input
                    type="password"
                    id="newPassword"
                    class="password-input"
                    placeholder="Enter new password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="toggle"
                    onclick="togglePassword('newPassword', this)"
                >
                    Show
                </button>

            </div>

            <div class="password-hint">
                Password must be at least 6 characters.
            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="input-wrapper">

                <input
                    type="password"
                    id="confirmPassword"
                    class="password-input"
                    placeholder="Confirm your new password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="toggle"
                    onclick="togglePassword('confirmPassword', this)"
                >
                    Show
                </button>

            </div>

        </div>


        <!-- SUBMIT -->

        <button
            type="submit"
            id="resetButton"
        >
            Reset Password
        </button>


    </form>


    <a
        href="/login"
        class="back"
    >
        ← Back to Sign In
    </a>


</div>


<script>


/* ================================
   SHOW / HIDE PASSWORD
================================ */

function togglePassword(id, button){

    const input =
        document.getElementById(id);


    if(input.type === "password"){

        input.type = "text";

        button.textContent = "Hide";

    }
    else{

        input.type = "password";

        button.textContent = "Show";

    }

}


/* ================================
   SHOW MESSAGE
================================ */

function showMessage(text, type){

    const message =
        document.getElementById("message");


    message.textContent = text;


    message.className =
        "message show " + type;

}


/* ================================
   RESET PASSWORD
================================ */

async function resetPassword(event){

    event.preventDefault();


    const email =
        document
            .getElementById("resetEmail")
            .value
            .trim()
            .toLowerCase();


    const newPassword =
        document
            .getElementById("newPassword")
            .value;


    const confirmPassword =
        document
            .getElementById("confirmPassword")
            .value;


    /* EMAIL CHECK */

    if(!email){

        showMessage(
            "Please enter your email address.",
            "error"
        );

        return;

    }


    /* PASSWORD LENGTH */

    if(newPassword.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;

    }


    /* PASSWORD MATCH */

    if(newPassword !== confirmPassword){

        showMessage(
            "New password and confirm password do not match.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById("resetButton");


    button.disabled = true;

    button.textContent =
        "Resetting Password...";


    try{


        /* SEND DATA TO BACKEND */

        const response =
            await fetch(
                "/api/forgot-password",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            email:email,

                            new_password:newPassword

                        })
                }
            );


        /* READ RESPONSE */

        const data =
            await response.json();


        /* ERROR RESPONSE */

        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Unable to reset password."
            );

        }


        /* SUCCESS */

        showMessage(
            data.message ||
            "Password reset successfully.",
            "success"
        );


        button.textContent =
            "Password Reset Successfully";


        /* REDIRECT TO LOGIN */

        setTimeout(
            function(){

                window.location.href =
                    "/login";

            },
            1800
        );


    }
    catch(error){


        console.error(
            "Forgot Password Error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to process request.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Reset Password";

    }

}

</script>


</body>

</html>
