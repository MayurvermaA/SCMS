<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Forgot Password - SCMS</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#080b16;

    color:white;
}

.card{
    width:430px;

    padding:40px;

    background:#111628;

    border:1px solid #303750;

    border-radius:20px;
}

.logo{
    width:70px;

    height:70px;

    margin:0 auto 25px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            #6c63ff,
            #00cfff
        );

    font-size:25px;

    font-weight:bold;
}

h1{
    text-align:center;

    margin-bottom:10px;
}

.subtitle{
    text-align:center;

    color:#858fa8;

    margin-bottom:30px;
}

label{
    display:block;

    margin-bottom:8px;

    color:#c8cede;
}

input{
    width:100%;

    padding:14px;

    background:#0b0f1d;

    color:white;

    border:1px solid #303750;

    border-radius:10px;

    outline:none;

    margin-bottom:18px;
}

button{
    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #6c63ff,
            #00cfff
        );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

.back{
    display:block;

    text-align:center;

    margin-top:20px;

    color:#8d98b3;

    text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

    <div class="logo">
        SC
    </div>

    <h1>
        Forgot Password?
    </h1>

    <p class="subtitle">
        Enter your registered email address.
    </p>

    <form onsubmit="resetPassword(event)">

        <label>
            Email Address
        </label>

        <input
            type="email"
            id="resetEmail"
            placeholder="Enter your email"
            required
        >

        <button
            type="submit"
        >
            Reset Password
        </button>

    </form>

    <a
        href="/login"
        class="back"
    >
        ← Back to Sign In
    </a>

</div>


<script>

async function resetPassword(event){

    event.preventDefault();

    const email =
        document.getElementById(
            "resetEmail"
        ).value.trim();

    try{

        const response =
            await fetch(
                "/api/forgot-password",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        email:email
                    })
                }
            );

        const data =
            await response.json();

        alert(
            data.message
        );

    }
    catch(error){

        alert(
            "Unable to process request"
        );

    }

}

</script>

</body>

</html>
